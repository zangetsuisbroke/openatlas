name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install
        working-directory: workspace

      - name: Build workspace exe
        run: bun run exe
        working-directory: workspace

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Build Electron zip
        run: npx electron-builder --win zip --config.productName=AtlasWorkspaceNew
        working-directory: desktop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasWorkspaceNew-win
          path: desktop/dist/AtlasWorkspaceNew-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/AtlasWorkspaceNew-*.zip
          draft: false
          prerelease: false
